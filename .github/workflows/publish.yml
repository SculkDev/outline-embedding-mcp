name: Build & publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.sculk.ltd
  # Harbor project. Every MCP server repo publishes into this same project.
  HARBOR_PROJECT: public-mcps
  # Harbor repository inside that project — i.e. this one MCP server.
  # Each MCP server lives in its own GitHub repo with its own copy of this
  # workflow, and REPOSITORY is the one value that differs between them.
  REPOSITORY: outline-embedding-mcp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Derive image name
        id: image
        run: echo "name=${REGISTRY}/${HARBOR_PROJECT}/${REPOSITORY}" >>"$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ env.REPOSITORY }}
            org.opencontainers.image.description=MCP server for semantic knowledge-base search over support tickets

      # Single-arch load so the image can actually be run before it is pushed.
      # The multi-arch build below reuses this layer cache.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.REPOSITORY }}:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (stdio handshake and tools/list)
        run: |
          set -euo pipefail
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm \
                -e KB_API_URL=https://example.invalid/tenant \
                -e KB_API_KEY=ci-placeholder \
                "${REPOSITORY}:smoke-test" \
            | tee smoke.jsonl
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const lines = readFileSync('smoke.jsonl', 'utf8').split('\n').filter(Boolean);
            const reply = lines.map((l) => JSON.parse(l)).find((m) => m.id === 2);
            if (!reply) throw new Error('no reply to tools/list');
            const got = reply.result.tools.map((t) => t.name);
            if (got.join() !== 'search_knowledge_base') throw new Error('unexpected tools: ' + got.join(', '));
            if (!reply.result.tools[0].inputSchema.required.includes('ticket')) throw new Error('ticket is not required');
            console.log('smoke test ok: ' + got.join(', '));
          "

      # Fails with an actionable message instead of an opaque `docker login`
      # error when the repository secrets have not been added yet.
      - name: Check Harbor credentials are configured
        if: github.event_name != 'pull_request'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          missing=""
          [ -n "${HARBOR_USERNAME:-}" ] || missing="HARBOR_USERNAME"
          [ -n "${HARBOR_PASSWORD:-}" ] || missing="${missing:+$missing and }HARBOR_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s): $missing"
            echo "Add them under Settings -> Secrets and variables -> Actions -> Secrets"
            echo "  HARBOR_USERNAME: the Harbor robot account name, exactly as Harbor shows it"
            echo "                   (for example robot\$${HARBOR_PROJECT}+github)"
            echo "  HARBOR_PASSWORD: that robot account's secret"
            exit 1
          fi
          echo "Harbor credentials present for ${REGISTRY}/${HARBOR_PROJECT}/${REPOSITORY}"

      - name: Log in to Harbor
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Harbor lists provenance/SBOM attestations as extra `unknown/unknown`
          # artifacts, so keep the manifest list clean.
          provenance: false
          sbom: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed to Harbor"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
